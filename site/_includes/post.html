{% set breadcrumb_link = '/writing' %}

{% extends 'base.html' %}

{% block external_js %}{% endblock %}

{% block internal_css %}
  <link rel="stylesheet" href="/css/maincontent.css">
  <link rel="stylesheet" href="/css/post.css">
{% endblock %}

{% block maincontent %}
<div id="post">
  <h1>{{ title }}</h1>
  <span class="date">{{ page.date | dateStr }}</span>
  {{ content | safe }}
</div>
{% endblock %}
